name: Build & Publish Release

# Zealot channel keys (32-char hex, used by app/controllers/api/apps/upload_controller.rb
# in Zealot: Channel.find_by(key: params[:channel_key])).
#
# nicessh_mac_arm64    e1ba2fc8c83a1af730d3a181e34a3406
# nicessh_mac_x86      9675db8639b12ef611c6f3a709fc87cf
# nicessh_win_arm64    2e83f2ae765083c567d668fdfa0fc85b
# nicessh_win_x86      dd6a4a7722ea0bc4b8a1a4adf98b89ca
# nicessh_linux_arm64  4188685491dd6bdbf5249d318404b8ee
# nicessh_linux_x86    8edd65d5970268a3e390e70d210064f3
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

# Re-pushing the same tag cancels the previous in-flight run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Publish (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: darwin-arm64
            # Use --bundles app (not dmg,app). macOS updater artifact is
            # NiceSSH.app.tar.gz, NOT .dmg — Tauri's minisign verifier
            # checks the .app.tar.gz.sig against the .app.tar.gz payload,
            # so the URL we feed to Tauri must point at .app.tar.gz.
            bundler_args: "--bundles app"
            zealot_channel: e1ba2fc8c83a1af730d3a181e34a3406  # nicessh_mac_arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: darwin-x64
            bundler_args: "--bundles app"
            zealot_channel: 9675db8639b12ef611c6f3a709fc87cf  # nicessh_mac_x86
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundler_args: "--bundles msi"
            zealot_channel: dd6a4a7722ea0bc4b8a1a4adf98b89ca  # nicessh_win_x86
          # Windows ARM64 (Surface Pro X, Snapdragon X laptops). GitHub
          # added windows-11-arm as a GA label in 2024.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
            bundler_args: "--bundles msi"
            zealot_channel: 2e83f2ae765083c567d668fdfa0fc85b  # nicessh_win_arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bundler_args: "--bundles appimage"
            zealot_channel: 8edd65d5970268a3e390e70d210064f3  # nicessh_linux_x86
          # Linux ARM64 (Raspberry Pi, AWS Graviton, Asahi). Native build on
          # GitHub's official ARM64 runner; the Install Linux build
          # dependencies step below installs native packages natively.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
            bundler_args: "--bundles appimage"
            zealot_channel: 4188685491dd6bdbf5249d318404b8ee  # nicessh_linux_arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: changelog
        shell: bash
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          previous_tag=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)

          changelog_section=""
          if [ -f CHANGELOG.md ]; then
            version="${CURRENT_TAG#v}"
            changelog_section=$(awk -v version="$version" '
              $0 ~ "^## [[]" { in_section = 0 }
              $0 ~ "^## [[]" version "[]]" { in_section = 1; next }
              /^## [[]/ && in_section { in_section = 0 }
              in_section
            ' CHANGELOG.md)
          fi

          {
            if [ -n "$changelog_section" ]; then
              printf '%s\n\n' "$changelog_section"
            fi

            printf '### Commits\n\n'
            if [ -n "$previous_tag" ]; then
              git log -n 100 "${previous_tag}..${CURRENT_TAG}" \
                --pretty=format:'- [`%h`]('$GITHUB_SERVER_URL'/'$GITHUB_REPOSITORY'/commit/%H) %s'
              printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$previous_tag" "$CURRENT_TAG"
            else
              git log -n 100 "$CURRENT_TAG" \
                --pretty=format:'- [`%h`]('$GITHUB_SERVER_URL'/'$GITHUB_REPOSITORY'/commit/%H) %s'
              printf '\n\n_First tagged release of this line._\n'
            fi
          } > release-notes.md

          delimiter="RELEASE_NOTES_$(git rev-parse --short HEAD)"
          {
            printf 'body<<%s\n' "$delimiter"
            cat release-notes.md
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      # Tauri on Linux links GTK + webkit2gtk; install the system dev
      # packages required by tauri-build / gdk-sys. Tauri 2.x needs the
      # webkit2gtk-4.1 line; `libgtk-3-dev` provides gdk-3.0.pc which
      # the rust gdk-sys crate looks up via pkg-config. The
      # `:arm64` suffixed packages and the cross-toolchain are required
      # for the linux-arm64 matrix entry (cross-compiled from this
      # x86_64 ubuntu-22.04 runner to aarch64-unknown-linux-gnu).
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # When the same tag is re-pushed (or a previous run was cancelled
      # mid-flight), the release + its `latest.json` may already exist on
      # GitHub. tauri-action's upload step then calls
      # `GET /repos/{owner}/{repo}/releases/assets/{id}` to look up the
      # previously uploaded asset, but the cached `latest.json` can
      # reference an asset ID that was replaced/removed by a concurrent
      # matrix job, producing `Error: Not Found - GET .../releases/assets/...`
      # and aborting the publish. We delete the existing release (idempotent
      # across matrix jobs) so every workflow run starts from a clean slate.
      # Only one matrix job needs to actually delete; `|| true` swallows
      # the 404 from the other jobs racing to delete the same release.
      - name: Delete pre-existing release for ${{ github.ref_name }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Deleting pre-existing release ${{ github.ref_name }}..."
            gh release delete "${{ github.ref_name }}" --cleanup-tags --yes
          else
            echo "No pre-existing release for ${{ github.ref_name }}."
          fi

      # tauri-action triggers `pnpm tauri build` (which runs `beforeBuildCommand`
      # = `pnpm build` per tauri.conf.json), signs every bundle with
      # TAURI_SIGNING_PRIVATE_KEY, and uploads dmg/msi/AppImage + .sig + the
      # generated `latest.json` to the GitHub release for ${{ github.ref_name }}.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NiceSSH ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.bundler_args }}

      # Mirror the bundles to Zealot (https://e9ab98.jzy.cc) so testers can
      # grab builds from the Zealot web UI / QR code. The Tauri auto-updater
      # still uses the GitHub Release (endpoints in tauri.conf.json) because
      # Zealot does not generate a Tauri-compatible latest.json.
      #
      # Requires the Zealot channel to have bundle_id set to "*" (or empty)
      # so the bundle_id_matched validation passes for unparsed .dmg/.msi/
      # .appimage files. AppInfo (Zealot's parser) cannot read Tauri bundles,
      # so each upload will have empty metadata on the Zealot side.
      - name: Upload to Zealot
        if: success() && matrix.zealot_channel != ''
        shell: bash
        env:
          ZEALOT_HOST: ${{ secrets.ZEALOT_HOST }}
          ZEALOT_TOKEN: ${{ secrets.ZEALOT_TOKEN }}
        run: |
          set -u

          if [ -z "$ZEALOT_HOST" ] || [ -z "$ZEALOT_TOKEN" ]; then
            echo "::warning::ZEALOT_HOST / ZEALOT_TOKEN not set, skipping Zealot upload"
            exit 0
          fi

          case "${{ matrix.target }}" in
            *-apple-darwin)  ext="app.tar.gz" ;;
            *-windows-msvc)  ext="msi" ;;
            *-linux-gnu)     ext="appimage" ;;
            *)
              echo "::warning::No Zealot upload rule for target ${{ matrix.target }}"
              exit 0
              ;;
          esac

          # Write the multi-line changelog to a temp file ONCE so we
          # can pass it to curl as `-F "changelog=<file"` instead of
          # inlining the multi-line markdown into the bash script.
          # Inlining breaks bash 3.2 (macOS runner) and Git Bash on
          # Windows, which split the markdown content into "commands"
          # like `f45bb44` / `6531fd0` and emit "command not found".
          CHLOG_FILE=$(mktemp)
          trap 'rm -f "$CHLOG_FILE"' EXIT
          printf '%s' "${{ steps.changelog.outputs.body }}" > "$CHLOG_FILE"

          shopt -s nullglob
          uploaded=0
          failed=0
          for f in src-tauri/target/${{ matrix.target }}/release/bundle/*/*.${ext}; do
            echo "Uploading $f -> channel ${{ matrix.zealot_channel }}"

            sig_file="${f}.sig"

            # Build curl args as a single non-empty array. Always has at
            # least file + channel_key, so we never hit bash 3.2's
            # `set -u` + empty-array footgun. tauri-action's .sig file
            # (when TAURI_SIGNING_PRIVATE_KEY is set) is read and embedded
            # in Zealot's custom_fields jsonb so the relay can pull it
            # out and serve to the Tauri updater.
            CURL_ARGS=(
              -fsSL -X POST "$ZEALOT_HOST/api/apps/upload?token=$ZEALOT_TOKEN"
              -F "file=@${f}"
              -F "channel_key=${{ matrix.zealot_channel }}"
            )

            if [ -f "$sig_file" ]; then
              sig_json=$(SIGNATURE_PATH="$sig_file" BUNDLE_PATH="$f" python3 -c "import json, os, sys; sig=open(os.environ['SIGNATURE_PATH']).read(); print(json.dumps({'tauri_signature': sig, 'tauri_filename': os.path.basename(os.environ['BUNDLE_PATH'])}))")
              CURL_ARGS+=(-F "custom_fields=${sig_json}")
              echo "  + embedded signature ($(wc -c < "$sig_file") bytes) for $(basename "$f")"
            else
              echo "::warning::No .sig file at $sig_file; relay will return empty signature"
            fi

            CURL_ARGS+=(
              -F "source=github-actions"
              -F "branch=${{ github.ref_name }}"
              -F "git_commit=${{ github.sha }}"
              -F "ci_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              -F "changelog=<${CHLOG_FILE}"
            )

            if curl "${CURL_ARGS[@]}"; then
              uploaded=$((uploaded + 1))
            else
              failed=$((failed + 1))
              echo "::warning::Zealot upload failed for $f"
            fi
          done

          if [ "$uploaded" -eq 0 ]; then
            echo "::warning::No ${ext} files found under src-tauri/target/${{ matrix.target }}/release/bundle/"
          else
            echo "Uploaded $uploaded file(s), $failed failure(s)"
          fi
