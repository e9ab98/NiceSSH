name: Build & Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

# Re-pushing the same tag cancels the previous in-flight run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Publish (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: darwin-arm64
            bundler_args: "--bundles dmg,app"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: darwin-x64
            bundler_args: "--bundles dmg,app"
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundler_args: "--bundles msi"
          # Windows ARM64 (Surface Pro X, Snapdragon X laptops). GitHub
          # added windows-11-arm as a GA label in 2024.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
            bundler_args: "--bundles msi"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bundler_args: "--bundles appimage"
          # Linux ARM64 (Raspberry Pi, AWS Graviton, Asahi). Native build on
          # GitHub's official ARM64 runner; the Install Linux build
          # dependencies step below installs native packages natively.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
            bundler_args: "--bundles appimage"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: changelog
        shell: bash
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          previous_tag=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)

          changelog_section=""
          if [ -f CHANGELOG.md ]; then
            version="${CURRENT_TAG#v}"
            changelog_section=$(awk -v version="$version" '
              $0 ~ "^## [[]" { in_section = 0 }
              $0 ~ "^## [[]" version "[]]" { in_section = 1; next }
              /^## [[]/ && in_section { in_section = 0 }
              in_section
            ' CHANGELOG.md)
          fi

          {
            if [ -n "$changelog_section" ]; then
              printf '%s\n\n' "$changelog_section"
            fi

            printf '### Commits\n\n'
            if [ -n "$previous_tag" ]; then
              git log -n 100 "${previous_tag}..${CURRENT_TAG}" \
                --pretty=format:'- [`%h`]('$GITHUB_SERVER_URL'/'$GITHUB_REPOSITORY'/commit/%H) %s'
              printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$previous_tag" "$CURRENT_TAG"
            else
              git log -n 100 "$CURRENT_TAG" \
                --pretty=format:'- [`%h`]('$GITHUB_SERVER_URL'/'$GITHUB_REPOSITORY'/commit/%H) %s'
              printf '\n\n_First tagged release of this line._\n'
            fi
          } > release-notes.md

          delimiter="RELEASE_NOTES_$(git rev-parse --short HEAD)"
          {
            printf 'body<<%s\n' "$delimiter"
            cat release-notes.md
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # Tauri on Linux links GTK + webkit2gtk; install the system dev
      # packages required by tauri-build / gdk-sys. Tauri 2.x needs the
      # webkit2gtk-4.1 line; `libgtk-3-dev` provides gdk-3.0.pc which
      # the rust gdk-sys crate looks up via pkg-config. The
      # `:arm64` suffixed packages and the cross-toolchain are required
      # for the linux-arm64 matrix entry (cross-compiled from this
      # x86_64 ubuntu-22.04 runner to aarch64-unknown-linux-gnu).
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # When the same tag is re-pushed (or a previous run was cancelled
      # mid-flight), the release + its `latest.json` may already exist on
      # GitHub. tauri-action's upload step then calls
      # `GET /repos/{owner}/{repo}/releases/assets/{id}` to look up the
      # previously uploaded asset, but the cached `latest.json` can
      # reference an asset ID that was replaced/removed by a concurrent
      # matrix job, producing `Error: Not Found - GET .../releases/assets/...`
      # and aborting the publish. We delete the existing release (idempotent
      # across matrix jobs) so every workflow run starts from a clean slate.
      # Only one matrix job needs to actually delete; `|| true` swallows
      # the 404 from the other jobs racing to delete the same release.
      - name: Delete pre-existing release for ${{ github.ref_name }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Deleting pre-existing release ${{ github.ref_name }}..."
            gh release delete "${{ github.ref_name }}" --cleanup-tags --yes
          else
            echo "No pre-existing release for ${{ github.ref_name }}."
          fi

      # tauri-action triggers `pnpm tauri build` (which runs `beforeBuildCommand`
      # = `pnpm build` per tauri.conf.json), signs every bundle with
      # TAURI_SIGNING_PRIVATE_KEY, and uploads dmg/msi/AppImage + .sig + the
      # generated `latest.json` to the GitHub release for ${{ github.ref_name }}.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NiceSSH ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.bundler_args }}
