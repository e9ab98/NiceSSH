name: Build & Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

# Re-pushing the same tag cancels the previous in-flight run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Publish (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: darwin-arm64
            bundler_args: "--bundles dmg,app"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: darwin-x64
            bundler_args: "--bundles dmg,app"
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundler_args: "--bundles msi"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bundler_args: "--bundles appimage"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action triggers `pnpm tauri build` (which runs `beforeBuildCommand`
      # = `pnpm build` per tauri.conf.json), signs every bundle with
      # TAURI_SIGNING_PRIVATE_KEY, and uploads dmg/msi/AppImage + .sig + the
      # generated `latest.json` to the GitHub release for ${{ github.ref_name }}.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NiceSSH ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for ${{ github.ref_name }}. Auto-built by tauri-action."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.bundler_args }}
